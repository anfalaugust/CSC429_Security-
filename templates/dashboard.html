<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
        </div>

        <!-- All values are auto-escaped by Jinja2 -->
        <h1>Welcome, {{ user.username }}</h1>
        <p class="subtitle">Your profile details</p>

        <ul class="details">
            <li><span>Username</span> {{ user.username }}</li>
            <li><span>Role</span> <strong class="badge">{{ user.role }}</strong></li>
            <li><span>Account created</span> {{ user.created_at }}</li>
        </ul>

        <!-- Page links -->
        <a class="button" href="{{ url_for('comments') }}">Comments</a>
        {% if user.role == 'admin' %}
            <!-- Link is only hidden for normal users; /admin is still protected on the server by @admin_required -->
            <a class="button" href="{{ url_for('admin') }}">Admin Page</a>
        {% endif %}

        <!-- Logout route -->
        <form method="POST" action="{{ url_for('logout') }}">
            <button type="submit" class="button button-secondary">Logout</button>
        </form>
    </main>
</body>
</html>
